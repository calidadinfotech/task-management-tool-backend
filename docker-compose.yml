version: '3.8'

services:
  backend:
    build: .
    container_name: ${CONTAINER_NAME:-task-management-backend}
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DATABASE_PATH=/app/data/tasks.db
    volumes:
      - task-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/tasks" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  task-data:
    driver: local
